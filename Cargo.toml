[profile.release]
opt-level = 3
lto = "thin"

# Task F9 item A6: the enum-cache regression tests drive the save-phase hook,
# which lives behind the `test-support` feature — so this target requires it.
# (In-crate `#[cfg(test)]` unit tests get the hook without the feature via
# `cfg(any(test, feature = "test-support"))`.)
[[test]]
name = "ms2_enum_cache"
path = "tests/ms2_enum_cache.rs"
required-features = ["test-support", "backend"]
