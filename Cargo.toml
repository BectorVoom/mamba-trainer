[package]
name = "mamba3"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Mamba-3 state space models in Rust on CubeCL: training, QAT, LoRA and inference."
repository = "https://github.com/BectorVoom/mamba-trainer"
readme = "README.md"
keywords = ["mamba", "ssm", "gpu", "cubecl", "deep-learning"]
categories = ["science", "algorithms"]

[dependencies]
cubecl = { version = "0.10.0", default-features = false, features = ["std", "stdlib"] }
half = { version = "2.7", features = ["num-traits", "bytemuck"] }
num-traits = "0.2"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = "1"
log = "0.4"
cube-math = "0.1.0"

[dev-dependencies]
rand = "0.9"

[features]
default = ["cpu"]
# Test-only hooks with no production cost (task F9 item A6): the enum-cache
# save-phase hook (`set_save_phase_hook`) exists only under this feature (or
# `cfg(test)` for in-crate unit tests), so a normal build takes no mutex per
# save phase and exposes no setter. The `ms2_enum_cache` regression test
# target enables it via `required-features` below.
test-support = []
# Runtimes. Enable exactly the ones you can build for.
cpu = ["cubecl/cpu", "backend"]
wgpu = ["cubecl/wgpu", "backend"]
# wgpu, but compiling kernels to SPIR-V through Vulkan instead of to WGSL. Same
# runtime type, so nothing above the backend changes.
vulkan = ["wgpu", "cubecl/wgpu-spirv"]
# wgpu, but compiling kernels to MSL for Metal instead of to WGSL. Same
# runtime type, so nothing above the backend changes.
msl = ["wgpu", "cubecl/wgpu-msl"]
cuda = ["cubecl/cuda", "backend"]
hip = ["cubecl/hip", "backend"]
# Internal marker meaning "at least one runtime is enabled". Every runtime feature
# turns it on; tests and examples key off it so they compile and run against
# whichever backend was selected, rather than being pinned to the CPU one.
backend = []

