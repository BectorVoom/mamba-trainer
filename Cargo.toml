[package]
name = "mamba3"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Mamba-3 state space models in Rust on CubeCL: training, QAT, LoRA and inference."
repository = "https://github.com/BectorVoom/mamba-trainer"
readme = "README.md"
keywords = ["mamba", "ssm", "gpu", "cubecl", "deep-learning"]
categories = ["science", "algorithms"]

[dependencies]
cubecl = { version = "0.10", default-features = false, features = ["std", "stdlib"] }
half = { version = "2.7", features = ["num-traits", "bytemuck"] }
num-traits = "0.2"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = "1"
log = "0.4"

[dev-dependencies]
rand = "0.9"

[features]
default = ["cpu"]
# Runtimes. Enable exactly the ones you can build for.
cpu = ["cubecl/cpu"]
wgpu = ["cubecl/wgpu"]
cuda = ["cubecl/cuda"]
hip = ["cubecl/hip"]

[[example]]
name = "train_lm"
required-features = ["cpu"]

[[example]]
name = "generate"
required-features = ["cpu"]

[[example]]
name = "finetune_lora"
required-features = ["cpu"]

[[example]]
name = "vision"
required-features = ["cpu"]

[[example]]
name = "bench"
required-features = ["cpu"]

[profile.release]
opt-level = 3
lto = "thin"
