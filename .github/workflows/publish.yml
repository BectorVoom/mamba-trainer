name: Publish to PyPI

# tools/build_wheel.sh is the single source of truth for how each backend is
# built and named; this workflow just runs it on the matrix of platforms a
# given backend can target and uploads the result. Each CubeCL backend is a
# compile-time feature (Cargo.toml), and pip has no way to pick one at install
# time under a single distribution name, so each backend is its own PyPI
# project, all importable as `mamba3_rl`:
#
#   mamba3-rl          cpu (default)   — portable, no GPU toolchain needed
#   mamba3-rl-wgpu     wgpu            — WGSL; wgpu picks Vulkan/Metal/DX12 underneath
#   mamba3-rl-vulkan   vulkan          — wgpu, shaders compiled to SPIR-V
#   mamba3-rl-msl      msl             — wgpu, shaders compiled to MSL (Metal)
#   mamba3-rl-cuda     cuda            — NVIDIA
#   mamba3-rl-rocm     hip             — AMD ROCm
#
# vulkan and msl are still the wgpu runtime (Cargo.toml), only the shader
# compilation target differs — vulkan is built on Linux/Windows, msl only on
# macOS, since that is where each actually runs.
#
# Auth is PyPI Trusted Publishing (OIDC) — no token stored in this repo. Each
# of the six project names needs its own pending publisher registered on
# pypi.org (Your projects -> mamba3-rl-* -> Settings -> Publishing) pointing
# at this workflow file and the `pypi` environment, before the first release
# tag reaches the publish job.
#
# CUDA and ROCm here are compile-only: GitHub-hosted runners have no GPU, so
# those jobs prove the crate builds against the CUDA/ROCm toolchains, not that
# the resulting wheel runs against real hardware.
#
# ROCm is also currently best-effort (`build-rocm`'s `continue-on-error` and
# `publish`'s `if:`): Ubuntu's own apt archive ships rocm-* packages whose
# versions conflict with the Radeon repo's exact-pinned dependencies, so the
# job fails until that apt-pinning is fixed. Its failure no longer blocks the
# other five projects from publishing; mamba3-rl-rocm just does not get a
# wheel for the affected Python versions until it is.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-portable:
    name: build ${{ matrix.backend }} / ${{ matrix.os }} / cp${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
        backend: [cpu, wgpu, vulkan, msl]
        exclude:
          # vulkan: Linux/Windows only. msl: Metal, so macOS only.
          - backend: vulkan
            os: macos-latest
          - backend: msl
            os: ubuntu-latest
          - backend: msl
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        shell: bash
        run: |
          PYTHON=python tools/build_wheel.sh ${{ matrix.backend }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.backend }}-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl

  build-cuda:
    name: build cuda / cp${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: PYTHON=python tools/build_wheel.sh cuda dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-cuda-${{ matrix.python }}
          path: dist/*.whl

  build-rocm:
    name: build rocm / cp${{ matrix.python }}
    # Best-effort: Ubuntu's own apt archive (22.04 and 24.04 both) ships
    # rocm-cmake/rocm-device-libs/etc.
    # at older versions that conflict with the Radeon 6.2 repo's
    # exact-pinned `rocm-hip-runtime-dev` dependencies — "Depends: hipcc
    # (= 1.1.1...) but 5.7.1-3 is to be installed" and the like. Fixing
    # that needs apt pinning (a preferences file favouring
    # repo.radeon.com, or every conflicting package listed at its Radeon
    # version) verified with a real run, not guessed at here. Until then
    # this job runs when it can and simply contributes no artifact when
    # it can't, rather than blocking every other backend's release
    # (see `publish`'s `if:` below, which doesn't gate on this job).
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ROCm toolkit
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.2 jammy main" | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y rocm-hip-runtime-dev

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: PYTHON=python tools/build_wheel.sh hip dist
        env:
          ROCM_PATH: /opt/rocm

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-rocm-${{ matrix.python }}
          path: dist/*.whl

  publish:
    name: publish to PyPI
    # build-rocm stays in `needs` so this job still waits for it and picks up
    # a rocm wheel when that job succeeds, but the `if:` below does not gate
    # on its result — its apt failure (see the comment on build-rocm above)
    # must not block cpu/wgpu/vulkan/msl/cuda from publishing.
    needs: [build-portable, build-cuda, build-rocm]
    if: always() && needs.build-portable.result == 'success' && needs.build-cuda.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
