# The Mamba-CLM financial decision module. Its own workspace so its dependencies
# (Arrow/Parquet, clap, toml) never touch the core crate's build.
[workspace]
resolver = "3"
members = ["crates/clm-data", "crates/clm-eval", "crates/clm-model", "crates/clm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mamba3 = { path = "..", default-features = false }
clm-data = { path = "crates/clm-data" }
clm-eval = { path = "crates/clm-eval" }
clm-model = { path = "crates/clm-model", default-features = false }
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4.6", features = ["derive"] }
rand = "0.9"
thiserror = "2"
half = "2.7"

[profile.release]
opt-level = 3
lto = "thin"

# Same patch as the core crate (HIP WMMA lane fix); patches apply per workspace root.
[patch.crates-io]
cubecl-cpp = { path = "../vendor/cubecl-cpp" }
